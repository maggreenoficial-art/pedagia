    <circle cx="132" cy="72" r="18" fill="#0A0A0A" stroke-width="2.5"/>
    <circle cx="188" cy="72" r="18" fill="#0A0A0A" stroke-width="2.5"/>
    <circle cx="132" cy="72" r="8" fill="none"/>
    <circle cx="188" cy="72" r="8" fill="none"/>
    <circle cx="132" cy="72" r="3" fill="#FFD100"/>
    <circle cx="188" cy="72" r="3" fill="#FFD100"/>
    <path d="M160 92 L160 118"/>
    <ellipse cx="160" cy="128" rx="34" ry="38" fill="#0A0A0A" stroke-width="2.5"/>
    <circle cx="160" cy="128" r="14" fill="none"/>
    <path d="M160 122 L160 134 M154 128 L166 128" stroke="#FFD100" stroke-width="2"/>
    <path d="M126 108 L88 98 M126 118 L82 128 M126 128 L88 148"/>
