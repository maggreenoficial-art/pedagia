  <text x="160" y="178" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="3">PROFESSOR</text>
  <text x="160" y="198" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="22" font-weight="700" fill="url(#pf-gold)" letter-spacing="4">FLUX</text>
